<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SVGder Studio — Image to Vector Lab</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
  <style>
    :root {
      --bg: #120f18;
      --panel: #1b1624;
      --border: #312742;
      --text: #f5effa;
      --muted: #a99bbd;
      --accent: #ff6fb5;
      --accent2: #8be9fd;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      background: radial-gradient(circle at top right, #261838 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      grid-template-columns: 330px 1fr;
    }
    aside {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }
    h1 {
      margin: 0;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
    .dropzone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s border-color, 0.2s background;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .dropzone:hover, .dropzone.drag {
      border-color: var(--accent);
      background: rgba(255, 111, 181, 0.08);
      color: var(--text);
    }
    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      background: #130f1a;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .tab {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 8px 6px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .tab.active {
      background: linear-gradient(135deg, #ff6fb533, #8be9fd22);
      color: var(--text);
      border: 1px solid #ff6fb566;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #14101c;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }
    label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      color: var(--muted);
      gap: 8px;
    }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    select {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 0.82rem;
    }
    .btn {
      background: linear-gradient(135deg, var(--accent), #c06cff);
      color: #140b18;
      border: none;
      border-radius: 10px;
      padding: 11px 14px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .btn.secondary {
      background: #251e33;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn:disabled { opacity: 0.5; cursor: wait; }
    .stats {
      font-size: 0.78rem;
      color: var(--muted);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: #14101c;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
    }
    .stat-val { color: var(--accent2); font-weight: 600; }
    main {
      display: flex;
      flex-direction: column;
      padding: 18px 22px;
      gap: 14px;
      overflow: hidden;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .pill-row { display: flex; gap: 8px; align-items: center; }
    .pill {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .pill.active { color: var(--text); border-color: var(--accent2); }
    .stage {
      flex: 1;
      position: relative;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background-image:
        linear-gradient(45deg, #1b1724 25%, transparent 25%),
        linear-gradient(-45deg, #1b1724 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #1b1724 75%),
        linear-gradient(-45deg, transparent 75%, #1b1724 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      background-color: #15111c;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 520px;
    }
    .canvas-wrap {
      position: relative;
      width: min(72vh, 720px);
      height: min(72vh, 720px);
      transform-origin: center center;
      transition: transform 0.1s ease-out;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      border-radius: 10px;
      overflow: hidden;
      background: white;
    }
    .layer-raster, .layer-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .layer-raster img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .layer-svg svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .split-handle {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      pointer-events: none;
      z-index: 5;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <aside>
    <div>
      <h1>SVGder Studio</h1>
      <div class="subtitle">Gremlin · Canny · Blobs · Low-Poly · Floodfill</div>
    </div>

    <div class="dropzone" id="dropzone">
      Drop PNG / JPG here or click to upload<br/>
      <small>(Ramapillar.jpeg preloaded)</small>
      <input type="file" id="fileInput" accept="image/*" class="hidden" />
    </div>

    <div class="tabs" id="modeTabs">
      <button class="tab active" data-mode="gremlin">Gremlin</button>
      <button class="tab" data-mode="canny">Canny</button>
      <button class="tab" data-mode="blobs">Blobs</button>
      <button class="tab" data-mode="lowpoly">Low-Poly</button>
      <button class="tab" data-mode="floodfill">Floodfill</button>
    </div>

    <div class="control-group" id="gremlinControls">
      <label>Colors <span id="colorsVal">24</span></label>
      <input type="range" id="colors" min="4" max="40" value="24" />
      <label>Curve Tolerance <span id="tolVal">0.85</span>px</label>
      <input type="range" id="tolerance" min="0.3" max="3.0" step="0.05" value="0.85" />
      <label>Background
        <select id="background">
          <option value="auto" selected>Auto</option>
          <option value="transparent">Transparent</option>
          <option value="white">White</option>
        </select>
      </label>
      <label><input type="checkbox" id="inkOnTop" checked /> Dark ink strokes on top</label>
    </div>

    <div class="control-group hidden" id="cannyControls">
      <label>Style
        <select id="cannyStyle">
          <option value="ink" selected>Ink Sketch</option>
          <option value="colored">Colored Edges</option>
          <option value="neon">Neon Glow</option>
          <option value="blueprint">Blueprint</option>
        </select>
      </label>
      <label>Stroke Width <span id="swVal">2.0</span>px</label>
      <input type="range" id="strokeWidth" min="0.5" max="6" step="0.25" value="2.0" />
      <label>Threshold Sigma <span id="sigmaVal">0.33</span></label>
      <input type="range" id="sigma" min="0.1" max="0.8" step="0.03" value="0.33" />
    </div>

    <div class="control-group hidden" id="blobsControls">
      <label>Gaussian Splats <span id="blobsVal">220</span></label>
      <input type="range" id="nBlobs" min="40" max="450" step="20" value="220" />
      <label><input type="checkbox" id="softGaussian" checked /> Soft radial Gaussian falloff</label>
    </div>

    <div class="control-group hidden" id="lowpolyControls">
      <label>Mesh Vertices <span id="polyVal">800</span></label>
      <input type="range" id="polyPoints" min="150" max="2500" step="50" value="800" />
      <label><input type="checkbox" id="wireframe" /> Show mesh wireframe</label>
    </div>

    <div class="control-group hidden" id="floodSearchControls">
      <label>Color Tolerance <span id="floodTolVal">18</span></label>
      <input type="range" id="floodColorTol" min="4" max="50" step="1" value="18" />
      <label>Edge Barrier <span id="floodEdgeVal">28</span></label>
      <input type="range" id="floodEdgeSens" min="0" max="70" step="2" value="28" />
      <label>Min Region Area <span id="floodAreaVal">20</span>px</label>
      <input type="range" id="floodMinArea" min="6" max="150" step="2" value="20" />
      <label>Max Outline Width <span id="floodStrokeVal">12</span>px</label>
      <input type="range" id="floodMaxStroke" min="3" max="24" step="1" value="12" />
      <label><input type="checkbox" id="floodDetectStrokes" checked /> Detect outlines vs. fills</label>
    </div>

    <button class="btn" id="convertBtn">Vectorize Image</button>
    <button class="btn secondary" id="downloadBtn" disabled>Download .SVG</button>
    <div style="display:flex; gap:8px;">
      <button class="btn secondary" id="copyDiffBtn" disabled style="flex:1; font-size:0.8rem; padding:8px;">Copy Diff PNG</button>
      <button class="btn secondary" id="downloadDiffBtn" disabled style="flex:1; font-size:0.8rem; padding:8px;">Download Diff PNG</button>
    </div>

    <div class="stats" id="statsBox">
      <div>Engine: <span class="stat-val" id="stEngine">—</span></div>
      <div>Time: <span class="stat-val" id="stTime">—</span></div>
      <div>Elements: <span class="stat-val" id="stElems">—</span></div>
      <div>Size: <span class="stat-val" id="stSize">—</span></div>
      <div>Diff: <span class="stat-val" id="stDiff">—</span></div>
    </div>

    <div class="stats" id="trackerBox" style="display:none;">
      <div style="font-weight:600; color:var(--text); margin-bottom:6px; font-size:0.78rem;">Mode Tradeoffs (click to switch)</div>
      <table id="trackerTable" style="width:100%; border-collapse:collapse; font-size:0.75rem; text-align:left;">
        <thead>
          <tr style="color:var(--muted); border-bottom:1px solid var(--border);">
            <th style="padding:3px 2px;">Mode</th>
            <th style="padding:3px 2px;">Time</th>
            <th style="padding:3px 2px;">Elems</th>
            <th style="padding:3px 2px;">Size</th>
            <th style="padding:3px 2px;">Diff</th>
          </tr>
        </thead>
        <tbody id="trackerBody"></tbody>
      </table>
    </div>
  </aside>

  <main>
    <div class="toolbar">
      <div class="pill-row">
        <button class="pill active" data-view="split">Split Compare</button>
        <button class="pill" data-view="svg">SVG Only</button>
        <button class="pill" data-view="raster">Original Only</button>
        <button class="pill" data-view="diff">Diff</button>
      </div>
      <div class="pill-row">
        <label style="gap:8px">Split <input type="range" id="splitRange" min="0" max="100" value="50" style="width:110px" /></label>
        <label style="gap:8px">Zoom <input type="range" id="zoomRange" min="1" max="6" step="0.25" value="1" style="width:100px" /> <span id="zoomVal">1x</span></label>
      </div>
    </div>

    <div class="stage">
      <div class="canvas-wrap" id="canvasWrap">
        <div class="layer-raster"><img id="rasterPreview" src="/api/sample" alt="Original" /></div>
        <div class="layer-svg" id="svgContainer"></div>
        <div class="split-handle" id="splitHandle" style="left: 50%"></div>
      </div>
    </div>
  </main>

  <script>
    let currentFile = null;
    let currentMode = "gremlin";
    let currentView = "split";
    let lastSvg = "";
    const svgCache = new Map();
    const modeTradeoffs = new Map();

    const $ = (id) => document.getElementById(id);

    function getFileSignature() {
      if (!currentFile) return "sample:Ramapillar";
      return `${currentFile.name}:${currentFile.size}:${currentFile.lastModified}`;
    }

    function getModeCacheKey(mode) {
      const sig = getFileSignature();
      if (mode === "gremlin") {
        return `${sig}|gremlin|${$("colors").value}|${$("tolerance").value}|${$("background").value}|${$("inkOnTop").checked}`;
      }
      if (mode === "canny") {
        return `${sig}|canny|${$("cannyStyle").value}|${$("strokeWidth").value}|${$("sigma").value}|${$("tolerance").value}`;
      }
      if (mode === "blobs") {
        return `${sig}|blobs|${$("nBlobs").value}|${$("softGaussian").checked}`;
      }
      if (mode === "lowpoly") {
        return `${sig}|lowpoly|${$("polyPoints").value}|${$("wireframe").checked}`;
      }
      if (mode === "floodfill") {
        return `${sig}|floodfill|${$("floodColorTol").value}|${$("floodEdgeSens").value}|${$("floodMinArea").value}|${$("floodMaxStroke").value}|${$("floodDetectStrokes").checked}|${$("tolerance").value}`;
      }
      return `${sig}|${mode}`;
    }

    function renderTracker() {
      const box = $("trackerBox");
      const body = $("trackerBody");
      if (modeTradeoffs.size === 0) {
        box.style.display = "none";
        return;
      }
      box.style.display = "block";
      const rows = Array.from(modeTradeoffs.entries()).sort((a, b) => a[1].elapsed_ms - b[1].elapsed_ms);
      body.innerHTML = rows.map(([m, st]) => {
        const elems = st.paths ?? st.strokes ?? st.blobs ?? st.triangles ?? "—";
        const kb = (st.bytes / 1024).toFixed(1) + " KB";
        const diffTxt = st.diff_pct !== undefined ? `${st.diff_pct.toFixed(1)}%` : "…";
        const activeStyle = m === currentMode ? "color:var(--accent); font-weight:600;" : "color:var(--muted);";
        return `<tr data-switch-mode="${m}" style="cursor:pointer; border-bottom:1px solid #ffffff0d; ${activeStyle}">
          <td style="padding:4px 2px;">${m}</td>
          <td style="padding:4px 2px;">${st.elapsed_ms} ms</td>
          <td style="padding:4px 2px;">${elems}</td>
          <td style="padding:4px 2px;">${kb}</td>
          <td style="padding:4px 2px;">${diffTxt}</td>
        </tr>`;
      }).join("");
      body.querySelectorAll("tr[data-switch-mode]").forEach((tr) => {
        tr.addEventListener("click", () => {
          const targetMode = tr.dataset.switchMode;
          const tab = document.querySelector(`#modeTabs .tab[data-mode="${targetMode}"]`);
          if (tab) tab.click();
        });
      });
    }

    function updateSplit() {
      const pct = Number($("splitRange").value);
      const svgLayer = $("svgContainer");
      const wrap = $("canvasWrap");
      const handle = $("splitHandle");
      svgLayer.style.mixBlendMode = "normal";
      wrap.style.background = "white";
      if (currentView === "svg") {
        svgLayer.style.clipPath = "inset(0 0 0 0)";
        svgLayer.style.opacity = "1";
        handle.classList.add("hidden");
      } else if (currentView === "raster") {
        svgLayer.style.opacity = "0";
        handle.classList.add("hidden");
      } else if (currentView === "diff") {
        svgLayer.style.clipPath = "inset(0 0 0 0)";
        svgLayer.style.opacity = "1";
        svgLayer.style.mixBlendMode = "difference";
        wrap.style.background = "#000";
        handle.classList.add("hidden");
      } else {
        svgLayer.style.opacity = "1";
        svgLayer.style.clipPath = `inset(0 0 0 ${pct}%)`;
        handle.classList.remove("hidden");
        handle.style.left = `${pct}%`;
      }
    }

    document.querySelectorAll("#modeTabs .tab").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#modeTabs .tab").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentMode = btn.dataset.mode;
        $("gremlinControls").classList.toggle("hidden", currentMode !== "gremlin");
        $("cannyControls").classList.toggle("hidden", currentMode !== "canny");
        $("blobsControls").classList.toggle("hidden", currentMode !== "blobs");
        $("lowpolyControls").classList.toggle("hidden", currentMode !== "lowpoly");
        $("floodSearchControls").classList.toggle("hidden", currentMode !== "floodfill");
        runVectorize();
      });
    });

    document.querySelectorAll(".pill[data-view]").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".pill[data-view]").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentView = btn.dataset.view;
        updateSplit();
      });
    });

    $("splitRange").addEventListener("input", updateSplit);
    $("zoomRange").addEventListener("input", () => {
      const z = $("zoomRange").value;
      $("zoomVal").textContent = `${z}x`;
      $("canvasWrap").style.transform = `scale(${z})`;
    });

    $("colors").addEventListener("input", (e) => ($("colorsVal").textContent = e.target.value));
    $("tolerance").addEventListener("input", (e) => ($("tolVal").textContent = e.target.value));
    $("strokeWidth").addEventListener("input", (e) => ($("swVal").textContent = e.target.value));
    $("sigma").addEventListener("input", (e) => ($("sigmaVal").textContent = e.target.value));
    $("nBlobs").addEventListener("input", (e) => ($("blobsVal").textContent = e.target.value));
    $("polyPoints").addEventListener("input", (e) => ($("polyVal").textContent = e.target.value));
    $("floodColorTol").addEventListener("input", (e) => ($("floodTolVal").textContent = e.target.value));
    $("floodEdgeSens").addEventListener("input", (e) => ($("floodEdgeVal").textContent = e.target.value));
    $("floodMinArea").addEventListener("input", (e) => ($("floodAreaVal").textContent = e.target.value));
    $("floodMaxStroke").addEventListener("input", (e) => ($("floodStrokeVal").textContent = e.target.value));

    const dz = $("dropzone");
    dz.addEventListener("click", () => $("fileInput").click());
    dz.addEventListener("dragover", (e) => { e.preventDefault(); dz.classList.add("drag"); });
    dz.addEventListener("dragleave", () => dz.classList.remove("drag"));
    dz.addEventListener("drop", (e) => {
      e.preventDefault();
      dz.classList.remove("drag");
      if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
    });
    $("fileInput").addEventListener("change", (e) => {
      if (e.target.files[0]) setFile(e.target.files[0]);
    });

    function setFile(file) {
      currentFile = file;
      svgCache.clear();
      modeTradeoffs.clear();
      renderTracker();
      $("rasterPreview").src = URL.createObjectURL(file);
      runVectorize();
    }

    async function computeSvgDiffPct(svgText) {
      const rasterImg = $("rasterPreview");
      if (!rasterImg.complete || !rasterImg.naturalWidth) {
        await new Promise((res) => {
          rasterImg.addEventListener("load", res, { once: true });
          setTimeout(res, 1500);
        });
      }
      const nw = rasterImg.naturalWidth || rasterImg.width;
      const nh = rasterImg.naturalHeight || rasterImg.height;
      if (!nw || !nh) return null;

      const maxSide = 256;
      const scale = Math.min(1, maxSide / Math.max(nw, nh));
      const w = Math.max(1, Math.round(nw * scale));
      const h = Math.max(1, Math.round(nh * scale));

      const c1 = document.createElement("canvas");
      c1.width = w;
      c1.height = h;
      const ctx1 = c1.getContext("2d");
      ctx1.fillStyle = "#fff";
      ctx1.fillRect(0, 0, w, h);
      ctx1.drawImage(rasterImg, 0, 0, w, h);
      const origData = ctx1.getImageData(0, 0, w, h).data;

      const svgBlob = new Blob([svgText], { type: "image/svg+xml;charset=utf-8" });
      const svgUrl = URL.createObjectURL(svgBlob);
      try {
        const svgImg = await new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error("SVG render failed"));
          img.src = svgUrl;
        });
        const c2 = document.createElement("canvas");
        c2.width = w;
        c2.height = h;
        const ctx2 = c2.getContext("2d");
        ctx2.fillStyle = "#fff";
        ctx2.fillRect(0, 0, w, h);
        ctx2.drawImage(svgImg, 0, 0, w, h);
        const svgData = ctx2.getImageData(0, 0, w, h).data;

        let totalErr = 0;
        const n = w * h;
        for (let i = 0; i < origData.length; i += 4) {
          totalErr +=
            Math.abs(origData[i] - svgData[i]) +
            Math.abs(origData[i + 1] - svgData[i + 1]) +
            Math.abs(origData[i + 2] - svgData[i + 2]);
        }
        return (totalErr / (n * 3 * 255)) * 100;
      } catch (_) {
        return null;
      } finally {
        URL.revokeObjectURL(svgUrl);
      }
    }

    function applyVectorResult(data, fromCache = false) {
      lastSvg = data.svg;
      $("svgContainer").innerHTML = data.svg;
      $("downloadBtn").disabled = false;
      $("copyDiffBtn").disabled = false;
      $("downloadDiffBtn").disabled = false;
      const st = data.stats;
      const modeForResult = st.engine;
      $("stEngine").textContent = fromCache ? `${st.engine} (cached)` : st.engine;
      $("stTime").textContent = `${st.elapsed_ms} ms`;
      $("stElems").textContent = st.paths ?? st.strokes ?? st.blobs ?? st.triangles ?? "—";
      $("stSize").textContent = `${(st.bytes / 1024).toFixed(1)} KB`;
      $("stDiff").textContent = st.diff_pct !== undefined ? `${st.diff_pct.toFixed(1)}%` : "…";
      modeTradeoffs.set(modeForResult, st);
      renderTracker();
      updateSplit();

      if (st.diff_pct === undefined) {
        computeSvgDiffPct(data.svg).then((pct) => {
          if (pct === null) return;
          st.diff_pct = pct;
          if (currentMode === modeForResult) {
            $("stDiff").textContent = `${pct.toFixed(1)}%`;
          }
          renderTracker();
        });
      }
    }

    async function runVectorize(forceRefresh = false) {
      const cacheKey = getModeCacheKey(currentMode);
      if (!forceRefresh && svgCache.has(cacheKey)) {
        applyVectorResult(svgCache.get(cacheKey), true);
        return;
      }
      const btn = $("convertBtn");
      btn.disabled = true;
      btn.textContent = "Vectorizing...";
      try {
        const fd = new FormData();
        if (currentFile) fd.append("file", currentFile);
        else fd.append("use_sample", "true");
        fd.append("mode", currentMode);
        fd.append("colors", $("colors").value);
        fd.append("tolerance", $("tolerance").value);
        fd.append("background", $("background").value);
        fd.append("ink_on_top", $("inkOnTop").checked ? "true" : "false");
        fd.append("canny_style", $("cannyStyle").value);
        fd.append("stroke_width", $("strokeWidth").value);
        fd.append("sigma", $("sigma").value);
        fd.append("n_blobs", $("nBlobs").value);
        fd.append("soft_gaussian", $("softGaussian").checked ? "true" : "false");
        fd.append("poly_points", $("polyPoints").value);
        fd.append("wireframe", $("wireframe").checked ? "true" : "false");
        fd.append("flood_color_tol", $("floodColorTol").value);
        fd.append("flood_edge_sens", $("floodEdgeSens").value);
        fd.append("flood_min_area", $("floodMinArea").value);
        fd.append("flood_max_stroke", $("floodMaxStroke").value);
        fd.append("flood_detect_strokes", $("floodDetectStrokes").checked ? "true" : "false");

        const res = await fetch("/api/vectorize", { method: "POST", body: fd });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Vectorization failed");

        svgCache.set(cacheKey, data);
        applyVectorResult(data, false);
      } catch (err) {
        alert(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Vectorize Image";
      }
    }

    $("convertBtn").addEventListener("click", () => runVectorize(true));

    let previewTimer = null;
    let previewSeq = 0;

    function buildFormData() {
      const fd = new FormData();
      if (currentFile) fd.append("file", currentFile);
      else fd.append("use_sample", "true");
      fd.append("mode", currentMode);
      fd.append("colors", $("colors").value);
      fd.append("tolerance", $("tolerance").value);
      fd.append("background", $("background").value);
      fd.append("ink_on_top", $("inkOnTop").checked ? "true" : "false");
      fd.append("canny_style", $("cannyStyle").value);
      fd.append("stroke_width", $("strokeWidth").value);
      fd.append("sigma", $("sigma").value);
      fd.append("n_blobs", $("nBlobs").value);
      fd.append("soft_gaussian", $("softGaussian").checked ? "true" : "false");
      fd.append("poly_points", $("polyPoints").value);
      fd.append("wireframe", $("wireframe").checked ? "true" : "false");
      fd.append("flood_color_tol", $("floodColorTol").value);
      fd.append("flood_edge_sens", $("floodEdgeSens").value);
      fd.append("flood_min_area", $("floodMinArea").value);
      fd.append("flood_max_stroke", $("floodMaxStroke").value);
      fd.append("flood_detect_strokes", $("floodDetectStrokes").checked ? "true" : "false");
      return fd;
    }

    async function runPreview() {
      const seq = ++previewSeq;
      try {
        const res = await fetch("/api/preview", { method: "POST", body: buildFormData() });
        if (!res.ok || seq !== previewSeq) return;
        const data = await res.json();
        if (seq !== previewSeq) return;
        $("svgContainer").innerHTML = data.svg;
        $("stEngine").textContent = `${data.mode} (preview)`;
        $("stTime").textContent = `${data.elapsed_ms} ms`;
        $("stElems").textContent = "—";
        $("stSize").textContent = "raster";
        updateSplit();
      } catch (_) {
        // Ignore transient preview errors while scrubbing
      }
    }

    function schedulePreview() {
      clearTimeout(previewTimer);
      previewTimer = setTimeout(runPreview, 120);
    }

    [
      "colors", "background", "inkOnTop",
      "cannyStyle", "strokeWidth", "sigma",
      "nBlobs", "softGaussian",
      "polyPoints", "wireframe",
      "floodColorTol", "floodEdgeSens", "floodMinArea",
    ].forEach((id) => {
      const el = $(id);
      if (el) el.addEventListener(el.type === "range" ? "input" : "change", schedulePreview);
    });
    $("downloadBtn").addEventListener("click", () => {
      if (!lastSvg) return;
      const blob = new Blob([lastSvg], { type: "image/svg+xml" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      const base = currentFile ? currentFile.name.replace(/\.[^.]+$/, "") : "Ramapillar";
      a.download = `${base}_${currentMode}.svg`;
      a.click();
    });

    async function renderDiffPngBlob() {
      const rasterImg = $("rasterPreview");
      const w = rasterImg.naturalWidth || rasterImg.width;
      const h = rasterImg.naturalHeight || rasterImg.height;
      if (!w || !h || !lastSvg) throw new Error("Nothing to export yet.");

      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");

      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(rasterImg, 0, 0, w, h);

      const svgBlob = new Blob([lastSvg], { type: "image/svg+xml;charset=utf-8" });
      const svgUrl = URL.createObjectURL(svgBlob);
      try {
        const svgImg = await new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error("Failed to render SVG onto canvas."));
          img.src = svgUrl;
        });
        ctx.globalCompositeOperation = "difference";
        ctx.drawImage(svgImg, 0, 0, w, h);
      } finally {
        URL.revokeObjectURL(svgUrl);
      }

      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (blob) resolve(blob);
          else reject(new Error("Failed to encode PNG."));
        }, "image/png");
      });
    }

    $("downloadDiffBtn").addEventListener("click", async () => {
      try {
        const blob = await renderDiffPngBlob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        const base = currentFile ? currentFile.name.replace(/\.[^.]+$/, "") : "Ramapillar";
        a.download = `${base}_${currentMode}_diff.png`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (err) {
        alert(err.message);
      }
    });

    $("copyDiffBtn").addEventListener("click", async () => {
      const btn = $("copyDiffBtn");
      const prev = btn.textContent;
      try {
        const blob = await renderDiffPngBlob();
        await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
        btn.textContent = "Copied!";
        setTimeout(() => (btn.textContent = prev), 1400);
      } catch (err) {
        alert("Clipboard copy failed: " + err.message);
      }
    });

    runVectorize();
  </script>
</body>
</html>
