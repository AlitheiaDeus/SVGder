[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "svgder"
version = "0.1.0"
description = "Multi-engine raster-to-SVG converter (Gremlin Bezier, Canny Strokes, Gaussian Blobs)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "opencv-python>=4.9",
  "pillow>=10.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
]

[project.scripts]
svgder = "svgder.cli:main"

[tool.setuptools.packages.find]
include = ["svgder*"]

[tool.setuptools.package-data]
svgder = ["static/*"]
